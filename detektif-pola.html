<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Detektif Pola: Temukan Benda yang Salah!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Fredoka', cursive, sans-serif;
      background: linear-gradient(135deg, #FEF3C7 0%, #FFFBEB 50%, #E0F2FE 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #1E293B;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }
    .game-card {
      width: 100%;
      max-width: 860px;
      background: #FFFFFF;
      border: 4px solid #FCD34D;
      border-radius: 28px;
      box-shadow: 0 16px 36px -8px rgba(245, 158, 11, 0.25);
      padding: 28px 18px;
      text-align: center;
      position: relative;
    }
    .header-title {
      font-size: clamp(20px, 4.5vw, 32px);
      font-weight: 700;
      color: #B45309;
      margin-bottom: 8px;
      line-height: 1.25;
    }
    .level-badge {
      display: inline-block;
      background: #FEF08A;
      color: #854D0E;
      font-weight: 600;
      font-size: 15px;
      padding: 6px 18px;
      border-radius: 9999px;
      margin-bottom: 12px;
      border: 2px dashed #CA8A04;
    }
    .clue-box {
      background: #EFF6FF;
      border: 2px solid #93C5FD;
      border-radius: 18px;
      padding: 12px 18px;
      margin: 0 auto 20px auto;
      max-width: 600px;
      font-size: clamp(14px, 3.2vw, 17px);
      color: #1E40AF;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .pattern-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding: 16px 8px;
      margin-bottom: 20px;
      -webkit-overflow-scrolling: touch;
    }
    .card-item {
      width: 76px;
      height: 76px;
      min-width: 72px;
      min-height: 72px;
      background: #F8FAFC;
      border: 3px solid #CBD5E1;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.06);
      transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    @media (min-width: 640px) {
      .card-item {
        width: 96px;
        height: 96px;
        min-width: 88px;
        min-height: 88px;
        border-radius: 26px;
        border-width: 4px;
      }
      .pattern-row {
        gap: 18px;
      }
    }
    .card-item:hover {
      transform: translateY(-4px);
      border-color: #F59E0B;
    }
    .card-item:active {
      transform: scale(0.93);
    }
    .card-item.shake {
      animation: wiggleShake 0.5s ease-in-out;
      border-color: #EF4444;
      background-color: #FEF2F2;
    }
    .card-item.correct {
      animation: correctPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      border-color: #10B981;
      background-color: #ECFDF5;
    }
    @keyframes wiggleShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px) rotate(-4deg); }
      40% { transform: translateX(8px) rotate(4deg); }
      60% { transform: translateX(-6px) rotate(-2deg); }
      80% { transform: translateX(6px) rotate(2deg); }
    }
    @keyframes correctPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.25) rotate(-10deg); }
      70% { transform: scale(1.15) rotate(8deg); }
      100% { transform: scale(1); }
    }
    .feedback-msg {
      font-size: clamp(15px, 3.5vw, 19px);
      font-weight: 600;
      color: #0F766E;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .victory-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 16px 10px;
    }
    .victory-title {
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 700;
      color: #B45309;
      margin-bottom: 12px;
    }
    .btn-restart {
      background: linear-gradient(180deg, #F59E0B 0%, #D97706 100%);
      color: white;
      font-family: inherit;
      font-size: 20px;
      font-weight: 700;
      padding: 14px 38px;
      border-radius: 9999px;
      border: 3px solid #B45309;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(217, 119, 6, 0.35);
      transition: transform 0.15s ease;
      margin-top: 24px;
    }
    .btn-restart:hover {
      transform: scale(1.05);
    }
    .btn-restart:active {
      transform: scale(0.96);
    }
    .audio-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: #F8FAFC;
      border: 2px solid #CBD5E1;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .audio-btn:hover {
      background: #E2E8F0;
    }
    .dots-indicator {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 6px;
      background: #E2E8F0;
      transition: all 0.3s ease;
    }
    .dot.active {
      width: 28px;
      background: #F59E0B;
    }
    .dot.completed {
      background: #10B981;
    }
  </style>
</head>
<body>
  <div class="game-card">
    <button id="toggleAudioBtn" class="audio-btn" title="Suara">🔊</button>
    
    <div id="playingArea">
      <h1 class="header-title">Detektif Pola: Temukan Benda yang Salah!</h1>
      <div id="levelBadge" class="level-badge">Level 1: Pola AB (Warna)</div>
      <div id="clueBox" class="clue-box">
        <span>🔍</span>
        <span id="clueText">Ada satu warna yang keliru menyusup! Klik warna yang salah.</span>
      </div>
      
      <div id="patternRow" class="pattern-row"></div>
      
      <div id="feedbackMsg" class="feedback-msg">Ketuk benda yang merusak pola urutan!</div>
      
      <div class="dots-indicator">
        <div id="dot0" class="dot active"></div>
        <div id="dot1" class="dot"></div>
        <div id="dot2" class="dot"></div>
        <div id="dot3" class="dot"></div>
        <div id="dot4" class="dot"></div>
        <div id="dot5" class="dot"></div>
      </div>
    </div>

    <div id="victoryScreen" class="victory-screen">
      <h2 class="victory-title">🎉 Hore! Kamu Detektif Hebat! 🎉</h2>
      <!-- SVG Detective Badge -->
      <svg width="200" height="200" viewBox="0 0 200 200">
        <!-- Ribbon -->
        <polygon points="60,140 30,195 65,180 85,195 75,140" fill="#DC2626" stroke="#991B1B" stroke-width="2"/>
        <polygon points="140,140 125,195 145,180 180,195 150,140" fill="#DC2626" stroke="#991B1B" stroke-width="2"/>
        <!-- Star Badge -->
        <polygon points="100,10 115,35 142,22 145,52 175,52 165,80 190,95 168,115 180,145 152,150 148,180 120,170 100,195 80,170 52,180 48,150 20,145 32,115 10,95 35,80 25,52 55,52 58,22 85,35" fill="#FACC15" stroke="#CA8A04" stroke-width="5" stroke-linejoin="round"/>
        <circle cx="100" cy="100" r="56" fill="#F59E0B" stroke="#B45309" stroke-width="4"/>
        <circle cx="100" cy="100" r="44" fill="#FEF08A"/>
        <!-- Magnifying Glass -->
        <circle cx="94" cy="94" r="22" fill="#E0F2FE" stroke="#0284C7" stroke-width="5"/>
        <line x1="110" y1="110" x2="132" y2="132" stroke="#78350F" stroke-width="8" stroke-linecap="round"/>
        <polygon points="94,76 100,88 112,89 103,98 106,110 94,103 82,110 85,98 76,89 88,88" fill="#F59E0B"/>
      </svg>
      <p style="font-size: 18px; margin-top: 14px; color: #475569; max-width: 480px; line-height: 1.4;">
        Luar biasa! Kamu berhasil menganalisis dan memperbaiki semua 6 pola yang rusak!
      </p>
      <button id="btnPlayAgain" class="btn-restart">Main Lagi 🔄</button>
    </div>
  </div>

  <script>
    // Web Audio API Synthesis
    let audioCtx = null;
    let isSoundOn = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freqs, duration) {
      if (!isSoundOn) return;
      initAudio();
      const now = audioCtx.currentTime;
      freqs.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
        gain.gain.setValueAtTime(0.001, now + idx * 0.08);
        gain.gain.linearRampToValueAtTime(0.2, now + idx * 0.08 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.08);
        osc.stop(now + idx * 0.08 + duration + 0.05);
      });
    }

    function playCorrectSound() {
      playTone([523.25, 659.25, 783.99, 1046.50], 0.35);
    }

    function playWrongSound() {
      if (!isSoundOn) return;
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.25);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.2, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.28);
    }

    function playVictoryFanfare() {
      playTone([523.25, 659.25, 783.99, 1046.50, 1318.51], 0.7);
    }

    // 6 Level Spesifikasi Detektif Pola Progresif
    const levels = [
      {
        title: "Level 1: Pola AB (Warna)",
        clue: "Pola: [Merah] - [Biru]. Ada warna kuning yang keliru menyusup!",
        wrongIndex: 3, // Index ke-4 (0-based: 3) adalah Kuning
        replacement: { type: 'color', value: 'biru' },
        items: [
          { type: 'color', value: 'merah' },
          { type: 'color', value: 'biru' },
          { type: 'color', value: 'merah' },
          { type: 'color', value: 'kuning' },
          { type: 'color', value: 'merah' },
          { type: 'color', value: 'biru' }
        ]
      },
      {
        title: "Level 2: Pola AAB (Bentuk)",
        clue: "Pola: Bintang - Bintang - Bulan. Cari bentuk yang salah!",
        wrongIndex: 4, // Benda ke-5 (0-based: 4) adalah Bintang, harus Bulan
        replacement: { type: 'shape', value: 'bulan' },
        items: [
          { type: 'shape', value: 'bintang' },
          { type: 'shape', value: 'bintang' },
          { type: 'shape', value: 'bulan' },
          { type: 'shape', value: 'bintang' },
          { type: 'shape', value: 'bintang' },
          { type: 'shape', value: 'bulan' }
        ]
      },
      {
        title: "Level 3: Pola ABC (Simbol)",
        clue: "Pola: Lingkaran - Persegi - Segitiga. Temukan yang keliru!",
        wrongIndex: 3, // Benda ke-4 (0-based: 3) adalah Persegi, harus Lingkaran
        replacement: { type: 'shape', value: 'lingkaran' },
        items: [
          { type: 'shape', value: 'lingkaran' },
          { type: 'shape', value: 'persegi' },
          { type: 'shape', value: 'segitiga' },
          { type: 'shape', value: 'persegi' },
          { type: 'shape', value: 'persegi' },
          { type: 'shape', value: 'segitiga' }
        ]
      },
      {
        title: "Level 4: Pola AABB (Bentuk Berpasangan)",
        clue: "Pola berpasangan: Matahari, Matahari, Awan, Awan! Mana yang keliru?",
        wrongIndex: 3, // Benda ke-4 (0-based: 3) adalah Bulan, harus Awan
        replacement: { type: 'shape', value: 'awan' },
        items: [
          { type: 'shape', value: 'matahari' },
          { type: 'shape', value: 'matahari' },
          { type: 'shape', value: 'awan' },
          { type: 'shape', value: 'bulan' },
          { type: 'shape', value: 'matahari' },
          { type: 'shape', value: 'matahari' }
        ]
      },
      {
        title: "Level 5: Pola ABCD (4 Bentuk Berurutan)",
        clue: "Urutan 4 bentuk: Lingkaran, Persegi, Segitiga, Bintang! Cari penyusupnya!",
        wrongIndex: 6, // Benda ke-7 (0-based: 6) adalah Hati, harus Segitiga
        replacement: { type: 'shape', value: 'segitiga' },
        items: [
          { type: 'shape', value: 'lingkaran' },
          { type: 'shape', value: 'persegi' },
          { type: 'shape', value: 'segitiga' },
          { type: 'shape', value: 'bintang' },
          { type: 'shape', value: 'lingkaran' },
          { type: 'shape', value: 'persegi' },
          { type: 'shape', value: 'hati' },
          { type: 'shape', value: 'bintang' }
        ]
      },
      {
        title: "Level 6: Pola ABCD (Tantangan Detektif Master)",
        clue: "Tantangan Master: Matahari, Awan, Bunga, Hati! Temukan benda yang merusak pola!",
        wrongIndex: 5, // Benda ke-6 (0-based: 5) adalah Bintang, harus Awan
        replacement: { type: 'shape', value: 'awan' },
        items: [
          { type: 'shape', value: 'matahari' },
          { type: 'shape', value: 'awan' },
          { type: 'shape', value: 'bunga' },
          { type: 'shape', value: 'hati' },
          { type: 'shape', value: 'matahari' },
          { type: 'shape', value: 'bintang' },
          { type: 'shape', value: 'bunga' },
          { type: 'shape', value: 'hati' }
        ]
      }
    ];

    let currentLevel = 0;
    let isWaiting = false;

    function getSvg(item) {
      const sz = window.innerWidth > 640 ? 56 : 46;
      if (item.value === 'merah') {
        return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#EF4444" stroke="#B91C1C" stroke-width="4"/><ellipse cx="38" cy="32" rx="12" ry="6" fill="#FFF" opacity="0.6" transform="rotate(-30 38 32)"/></svg>`;
      }
      if (item.value === 'biru') {
        return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#3B82F6" stroke="#1D4ED8" stroke-width="4"/><ellipse cx="38" cy="32" rx="12" ry="6" fill="#FFF" opacity="0.6" transform="rotate(-30 38 32)"/></svg>`;
      }
      if (item.value === 'kuning') {
        return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#FACC15" stroke="#D97706" stroke-width="4"/><ellipse cx="38" cy="32" rx="12" ry="6" fill="#FFF" opacity="0.7" transform="rotate(-30 38 32)"/></svg>`;
      }
      if (item.value === 'bintang') {
        return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><polygon points="50,5 64,34 96,38 72,61 79,93 50,77 21,93 28,61 4,38 36,34" fill="#FACC15" stroke="#CA8A04" stroke-width="4" stroke-linejoin="round"/><circle cx="43" cy="46" r="3.5" fill="#713F12"/><circle cx="57" cy="46" r="3.5" fill="#713F12"/><path d="M 45 54 Q 50 60 55 54" stroke="#713F12" stroke-width="2.5" fill="none"/></svg>`;
      }
      if (item.value === 'bulan') {
        return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><path d="M 68 12 A 40 40 0 1 1 20 78 A 38 38 0 0 0 68 12 Z" fill="#A855F7" stroke="#581C87" stroke-width="4"/><circle cx="44" cy="42" r="3" fill="#3B0764"/><path d="M 40 52 Q 47 58 53 50" stroke="#3B0764" stroke-width="2.5" fill="none"/></svg>`;
      }
      if (item.value === 'lingkaran') {
        return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#F43F5E" stroke="#881337" stroke-width="4"/><ellipse cx="38" cy="32" rx="10" ry="5" fill="#FFF" opacity="0.6" transform="rotate(-30 38 32)"/></svg>`;
      }
      if (item.value === 'persegi') {
        return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><rect x="14" y="14" width="72" height="72" rx="16" fill="#10B981" stroke="#065F46" stroke-width="4"/><ellipse cx="36" cy="32" rx="10" ry="5" fill="#FFF" opacity="0.6"/></svg>`;
      }
      if (item.value === 'segitiga') {
        return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><polygon points="50,12 88,82 12,82" fill="#F97316" stroke="#9A3412" stroke-width="4" stroke-linejoin="round"/><ellipse cx="50" cy="38" rx="7" ry="4" fill="#FFF" opacity="0.6"/></svg>`;
      }
      if (item.value === 'hati') {
        return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><path d="M 50 86 C 18 64 6 42 12 26 C 18 10 36 10 50 24 C 64 10 82 10 88 26 C 94 42 82 64 50 86 Z" fill="#F43F5E" stroke="#9F1239" stroke-width="4"/><circle cx="38" cy="38" r="3" fill="#881337"/><circle cx="62" cy="38" r="3" fill="#881337"/><path d="M 44 46 Q 50 52 56 46" stroke="#881337" stroke-width="2.5" fill="none"/><ellipse cx="32" cy="24" rx="8" ry="4" fill="#FFF" opacity="0.6" transform="rotate(-35 32 24)"/></svg>`;
      }
      if (item.value === 'matahari') {
        return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><g stroke="#D97706" stroke-width="4" stroke-linecap="round"><line x1="50" y1="8" x2="50" y2="18"/><line x1="50" y1="82" x2="50" y2="92"/><line x1="8" y1="50" x2="18" y2="50"/><line x1="82" y1="50" x2="92" y2="50"/><line x1="20" y1="20" x2="28" y2="28"/><line x1="72" y1="72" x2="80" y2="80"/><line x1="80" y1="20" x2="72" y2="28"/><line x1="28" y1="72" x2="20" y2="80"/></g><circle cx="50" cy="50" r="28" fill="#FBBF24" stroke="#B45309" stroke-width="3"/><circle cx="42" cy="46" r="3.5" fill="#78350F"/><circle cx="58" cy="46" r="3.5" fill="#78350F"/><path d="M 43 54 Q 50 62 57 54" stroke="#78350F" stroke-width="2.5" fill="none"/></svg>`;
      }
      if (item.value === 'awan') {
        return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><path d="M 28 66 A 18 18 0 0 1 24 38 A 22 22 0 0 1 54 26 A 24 24 0 0 1 82 44 A 18 18 0 0 1 76 66 Z" fill="#7DD3FC" stroke="#0369A1" stroke-width="3.5"/><circle cx="44" cy="46" r="3" fill="#0C4A6E"/><circle cx="58" cy="46" r="3" fill="#0C4A6E"/><path d="M 47 53 Q 51 57 55 53" stroke="#0C4A6E" stroke-width="2" fill="none"/><ellipse cx="36" cy="34" rx="8" ry="4" fill="#FFF" opacity="0.7" transform="rotate(-20 36 34)"/></svg>`;
      }
      if (item.value === 'bunga') {
        return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><circle cx="50" cy="24" r="14" fill="#F472B6" stroke="#BE185D" stroke-width="2.5"/><circle cx="75" cy="42" r="14" fill="#F472B6" stroke="#BE185D" stroke-width="2.5"/><circle cx="65" cy="72" r="14" fill="#F472B6" stroke="#BE185D" stroke-width="2.5"/><circle cx="35" cy="72" r="14" fill="#F472B6" stroke="#BE185D" stroke-width="2.5"/><circle cx="25" cy="42" r="14" fill="#F472B6" stroke="#BE185D" stroke-width="2.5"/><circle cx="50" cy="50" r="16" fill="#FACC15" stroke="#A16207" stroke-width="3"/><circle cx="45" cy="48" r="2.5" fill="#713F12"/><circle cx="55" cy="48" r="2.5" fill="#713F12"/><path d="M 46 54 Q 50 58 54 54" stroke="#713F12" stroke-width="2" fill="none"/></svg>`;
      }
      return '';
    }

    function updateDots() {
      for (let i = 0; i < levels.length; i++) {
        const dot = document.getElementById('dot' + i);
        if (dot) {
          dot.className = 'dot';
          if (i === currentLevel) dot.classList.add('active');
          else if (i < currentLevel) dot.classList.add('completed');
        }
      }
    }

    function renderLevel() {
      const lvl = levels[currentLevel];
      document.getElementById('levelBadge').innerText = lvl.title;
      document.getElementById('clueText').innerText = lvl.clue;
      document.getElementById('feedbackMsg').innerText = "Ketuk benda yang merusak pola urutan!";
      updateDots();
      
      const row = document.getElementById('patternRow');
      row.innerHTML = '';

      lvl.items.forEach((item, idx) => {
        const btn = document.createElement('button');
        btn.className = 'card-item';
        btn.innerHTML = getSvg(item);
        btn.onclick = () => handleCardClick(idx, btn);
        row.appendChild(btn);
      });
    }

    function handleCardClick(idx, btn) {
      if (isWaiting) return;
      const lvl = levels[currentLevel];

      if (idx === lvl.wrongIndex) {
        // BENAR
        isWaiting = true;
        playCorrectSound();
        btn.classList.add('correct');
        document.getElementById('feedbackMsg').innerText = "🎉 Hebat! Polanya sudah benar!";

        // Ganti visual item
        lvl.items[idx] = { ...lvl.replacement };
        setTimeout(() => {
          btn.innerHTML = getSvg(lvl.items[idx]);
        }, 150);

        setTimeout(() => {
          isWaiting = false;
          if (currentLevel + 1 < levels.length) {
            currentLevel++;
            renderLevel();
          } else {
            showVictory();
          }
        }, 1500);
      } else {
        // SALAH
        playWrongSound();
        btn.classList.add('shake');
        document.getElementById('feedbackMsg').innerText = "🤔 Benda ini sudah tepat! Coba cari yang lain...";
        setTimeout(() => {
          btn.classList.remove('shake');
        }, 550);
      }
    }

    function showVictory() {
      document.getElementById('playingArea').style.display = 'none';
      const victory = document.getElementById('victoryScreen');
      victory.style.display = 'flex';
      playVictoryFanfare();
    }

    document.getElementById('btnPlayAgain').onclick = () => {
      currentLevel = 0;
      levels[0].items[3] = { type: 'color', value: 'kuning' };
      levels[1].items[4] = { type: 'shape', value: 'bintang' };
      levels[2].items[3] = { type: 'shape', value: 'persegi' };
      levels[3].items[3] = { type: 'shape', value: 'bulan' };
      levels[4].items[6] = { type: 'shape', value: 'hati' };
      levels[5].items[5] = { type: 'shape', value: 'bintang' };
      document.getElementById('playingArea').style.display = 'block';
      document.getElementById('victoryScreen').style.display = 'none';
      renderLevel();
    };

    const audioToggle = document.getElementById('toggleAudioBtn');
    audioToggle.onclick = () => {
      isSoundOn = !isSoundOn;
      audioToggle.innerText = isSoundOn ? '🔊' : '🔇';
    };

    // Mulai game
    renderLevel();
  </script>
</body>
</html>
