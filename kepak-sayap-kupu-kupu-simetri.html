<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kepak Sayap Kupu-Kupu - Pola Simetri Cermin (PAUD)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Fredoka', cursive, sans-serif;
      background: linear-gradient(180deg, #BAE6FD 0%, #E0F2FE 55%, #BBF7D0 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      color: #1E293B;
      padding: 12px;
    }

    /* Header */
    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 3px solid #FDE68A;
      border-radius: 20px;
      padding: 10px 18px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.06);
    }
    .game-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #9D174D;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .level-badge {
      background: #FEF08A;
      color: #854D0E;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.9rem;
      border: 2px solid #FACC15;
    }
    .btn-sound {
      background: #F1F5F9;
      border: 2px solid #CBD5E1;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* Subtitle Banner */
    .instruction-banner {
      margin-top: 6px;
      background: #FEF3C7;
      border: 2px dashed #F59E0B;
      border-radius: 14px;
      padding: 6px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #92400E;
      text-align: center;
      max-width: 600px;
    }

    /* Guides */
    .wing-guides {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: space-between;
      padding: 4px 20px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #475569;
    }
    .guide-left {
      background: #FFE4E6;
      color: #BE123C;
      padding: 3px 10px;
      border-radius: 12px;
      border: 1.5px solid #FDA4AF;
    }
    .guide-right {
      background: #DCFCE7;
      color: #15803D;
      padding: 3px 10px;
      border-radius: 12px;
      border: 1.5px solid #86EFAC;
    }

    /* Butterfly Canvas / SVG Container */
    .butterfly-container {
      width: 100%;
      max-width: 760px;
      position: relative;
      margin: 4px 0;
      perspective: 1000px;
    }
    svg.butterfly-svg {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 12px 16px rgba(0,0,0,0.12));
    }

    /* Animations */
    .bounce-in {
      animation: bounceInAnim 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes bounceInAnim {
      0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
      60% { transform: scale(1.25) rotate(4deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    .shake {
      animation: shakeAnim 0.45s ease-in-out;
    }
    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-9px) rotate(-3deg); }
      40% { transform: translateX(9px) rotate(3deg); }
      60% { transform: translateX(-6px) rotate(-2deg); }
      80% { transform: translateX(6px) rotate(2deg); }
    }

    .flap-left {
      transform-origin: 400px 260px;
      animation: flapLeft 1.4s ease-in-out;
    }
    @keyframes flapLeft {
      0% { transform: rotateY(0deg); }
      25% { transform: rotateY(65deg); }
      50% { transform: rotateY(15deg); }
      75% { transform: rotateY(70deg); }
      100% { transform: rotateY(0deg); }
    }

    .flap-right {
      transform-origin: 400px 260px;
      animation: flapRight 1.4s ease-in-out;
    }
    @keyframes flapRight {
      0% { transform: rotateY(0deg); }
      25% { transform: rotateY(-65deg); }
      50% { transform: rotateY(-15deg); }
      75% { transform: rotateY(-70deg); }
      100% { transform: rotateY(0deg); }
    }

    .pulse-target {
      animation: pulseTarget 1.5s infinite;
    }
    @keyframes pulseTarget {
      0%, 100% { transform: scale(1); stroke-width: 4; }
      50% { transform: scale(1.08); stroke-width: 6; }
    }

    /* Target Slot Indicator */
    .slot-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: #78350F;
      margin: 4px 0;
      text-align: center;
    }

    /* Choice Buttons Section */
    .choices-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 8px 12px 14px;
    }
    .choice-btn {
      width: 86px;
      height: 86px;
      min-width: 80px;
      min-height: 80px;
      background: #FFFFFF;
      border: 4px solid #FDE68A;
      border-radius: 24px;
      box-shadow: 0 7px 0 0 #F59E0B, 0 10px 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .choice-btn:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 0 #F59E0B, 0 4px 8px rgba(0,0,0,0.1);
    }
    .choice-btn svg {
      width: 48px;
      height: 48px;
    }
    .choice-btn span {
      font-size: 0.8rem;
      font-weight: 700;
      color: #334155;
      margin-top: 3px;
    }

    /* Victory Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .victory-card {
      background: #FFFFFF;
      border: 5px solid #FBBF24;
      border-radius: 28px;
      padding: 30px 24px;
      text-align: center;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 30px rgba(0,0,0,0.25);
      animation: bounceInAnim 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .victory-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #BE185D;
      margin: 12px 0 6px;
    }
    .victory-desc {
      font-size: 1.05rem;
      color: #475569;
      margin-bottom: 22px;
      font-weight: 600;
    }
    .btn-play-again {
      background: linear-gradient(135deg, #10B981, #059669);
      color: white;
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 800;
      padding: 14px 34px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 0 0 #047857, 0 10px 15px rgba(0,0,0,0.15);
      transition: transform 0.15s;
    }
    .btn-play-again:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 0 #047857;
    }

    /* Little Garden decor at bottom */
    .garden-bottom {
      width: 100%;
      max-width: 700px;
      display: flex;
      justify-content: space-around;
      font-size: 1.4rem;
      opacity: 0.75;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- Header -->

    </div>
    <div class="level-badge" id="levelBadge">Level 1 / 3</div>

  <!-- Banner Instruksi -->
  <div class="instruction-banner" id="levelDesc">

  <div class="butterfly-container">
    <svg class="butterfly-svg" viewBox="0 0 800 520" id="butterflySvg" xmlns="http://www.w3.org/2000/svg">
      <defs>

        <circle cx="400" cy="150" r="24" fill="#B45309" stroke="#451A03" stroke-width="4"/>

        <!-- Antena -->
        <path d="M 394,140 C 385,110 350,90 340,105 C 335,112 344,124 350,118" fill="none" stroke="#451A03" stroke-width="4" stroke-linecap="round"/>
        <circle cx="342" cy="112" r="7" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>

        <!-- Wajah Manis -->

        <ellipse cx="392" cy="146" rx="5" ry="6" fill="#1F2937"/>

  <!-- Indikator Bagian -->
  <div class="slot-label" id="slotInstruction">
    👉 Pasang untuk bagian <b>ATAS</b> sayap kanan
  </div>

  <!-- Tombol Pilihan Hiasan (Besar >= 80px) -->

  <!-- Hiasan Taman Bawah -->
  <div class="garden-bottom">
    <span>🌸</span><span>🌱</span><span>🌼</span><span>🌿</span><span>🌺</span>

  <!-- Modal Kemenangan Akhir Level 3 -->
  <div class="modal-overlay" id="victoryModal">
    <div class="victory-card">
      <div style="font-size: 4rem;">🦋✨🎉</div>
      <h2 class="victory-title">Hore! Sayap Lulu Simetris & Cantik!</h2>
      <p class="victory-desc">Kamu hebat sekali telah menyelesaikan semua 3 level simetri!</p>
      <button class="btn-play-again" id="btnPlayAgain">Main Lagi 🔄</button>
    </div>
  </div>

  <script>
    // --- Web Audio API Synth ---
    let audioCtx = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Suara Benar (Nada tinggi ajaib)
    function playCorrectSound() {
      if (isMuted) return;
      initAudio();
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
      const now = audioCtx.currentTime;
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.08);
        gain.gain.setValueAtTime(0.001, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.24, now + i * 0.08 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.36);
      });
    }

    // Suara Salah (Nada rendah lembut / boing)
    function playWrongSound() {
      if (isMuted) return;
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(130, now + 0.28);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.2, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.31);
    }

    // Suara Kepakan Sayap (Wing flutter)
    function playWingFlapSound() {
      if (isMuted) return;
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      for (let i = 0; i < 4; i++) {
        const t = now + i * 0.2;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(260 + i * 40, t);
        osc.frequency.exponentialRampToValueAtTime(440 + i * 30, t + 0.12);
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.18, t + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.19);
      }
    }

    // Fanfare Kemenangan
    function playVictoryFanfare() {
      if (isMuted) return;
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      [
        { f: 523.25, t: 0, d: 0.2 },
        { f: 659.25, t: 0.15, d: 0.2 },
        { f: 783.99, t: 0.3, d: 0.25 },
        { f: 1046.5, t: 0.5, d: 0.6 }
      ].forEach(n => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(n.f, now + n.t);
        gain.gain.setValueAtTime(0.001, now + n.t);
        gain.gain.linearRampToValueAtTime(0.28, now + n.t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + n.t + n.d);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + n.t);
        osc.stop(now + n.t + n.d + 0.05);
      });
    }

    // --- Helper SVG Shape Builders ---
    function renderShapeSvg(shape, fillColor, strokeColor, size = 50) {
      if (shape === 'circle') {
        return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="42" fill="${fillColor}" stroke="${strokeColor}" stroke-width="5"/>
          <ellipse cx="38" cy="34" rx="16" ry="9" transform="rotate(-25 38 34)" fill="#fff" fill-opacity="0.4"/>
        </svg>`;
      }
      if (shape === 'star') {
        return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">
          <path d="M 50,8 L 62,35 L 92,38 L 70,58 L 76,88 L 50,72 L 24,88 L 30,58 L 8,38 L 38,35 Z"
                fill="${fillColor}" stroke="${strokeColor}" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 50,15 L 58,35 L 75,38 L 60,52 Z" fill="#fff" fill-opacity="0.45"/>
        </svg>`;
      }
      if (shape === 'heart') {
        return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">
          <path d="M 50,88 C 22,70 8,50 8,30 C 8,14 20,8 32,8 C 41,8 47,14 50,20 C 53,14 59,8 68,8 C 80,8 92,14 92,30 C 92,50 78,70 50,88 Z"
                fill="${fillColor}" stroke="${strokeColor}" stroke-width="5" stroke-linejoin="round"/>
          <ellipse cx="32" cy="25" rx="11" ry="6" transform="rotate(-25 32 25)" fill="#fff" fill-opacity="0.45"/>
        </svg>`;
      }
      if (shape === 'flower') {
        let petals = '';
        for (let a = 0; a < 360; a += 72) {
          const cx = 50 + 26 * Math.sin((a * Math.PI) / 180);
          const cy = 50 - 26 * Math.cos((a * Math.PI) / 180);
          petals += `<circle cx="${cx}" cy="${cy}" r="17" fill="${fillColor}" stroke="${strokeColor}" stroke-width="4"/>`;
        }
        return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">
          ${petals}
          <circle cx="50" cy="50" r="16" fill="#FEF08A" stroke="#EAB308" stroke-width="4"/>
        </svg>`;
      }
      return '';
    }

    // --- Definisi Level Game ---
    const levels = [
      {
        num: 1,
        title: "Level 1: Pola 2 Warna",
        desc: "Cocokkan pola warna sayap kiri: Merah - Biru - Merah",
        type: 'color',
        left: [
          { shape: 'circle', color: '#EF4444', stroke: '#B91C1C', name: 'Merah' },
          { shape: 'circle', color: '#3B82F6', stroke: '#1D4ED8', name: 'Biru' },
          { shape: 'circle', color: '#EF4444', stroke: '#B91C1C', name: 'Merah' }
        ],
        choices: [
          { shape: 'circle', color: '#EF4444', stroke: '#B91C1C', name: 'Merah' },
          { shape: 'circle', color: '#3B82F6', stroke: '#1D4ED8', name: 'Biru' },
          { shape: 'circle', color: '#FBBF24', stroke: '#D97706', name: 'Kuning' },
          { shape: 'circle', color: '#10B981', stroke: '#047857', name: 'Hijau' }
        ]
      },
      {
        num: 2,
        title: "Level 2: Pola 2 Bentuk",
        desc: "Cocokkan bentuk sayap kiri: Bintang - Lingkaran - Bintang",
        type: 'shape',
        left: [
          { shape: 'star', color: '#F59E0B', stroke: '#B45309', name: 'Bintang' },
          { shape: 'circle', color: '#8B5CF6', stroke: '#6D28D9', name: 'Lingkaran' },
          { shape: 'star', color: '#F59E0B', stroke: '#B45309', name: 'Bintang' }
        ],
        choices: [
          { shape: 'star', color: '#F59E0B', stroke: '#B45309', name: 'Bintang' },
          { shape: 'circle', color: '#8B5CF6', stroke: '#6D28D9', name: 'Lingkaran' },
          { shape: 'heart', color: '#EC4899', stroke: '#BE185D', name: 'Hati' },
          { shape: 'flower', color: '#06B6D4', stroke: '#0E7490', name: 'Bunga' }
        ]
      },
      {
        num: 3,
        title: "Level 3: Pola 3 Bentuk Variatif",
        desc: "Cocokkan bentuk sayap kiri: Hati - Bintang - Lingkaran",
        type: 'mixed',
        left: [
          { shape: 'heart', color: '#EC4899', stroke: '#BE185D', name: 'Hati' },
          { shape: 'star', color: '#F59E0B', stroke: '#B45309', name: 'Bintang' },
          { shape: 'circle', color: '#0284C7', stroke: '#0369A1', name: 'Lingkaran' }
        ],
        choices: [
          { shape: 'heart', color: '#EC4899', stroke: '#BE185D', name: 'Hati' },
          { shape: 'star', color: '#F59E0B', stroke: '#B45309', name: 'Bintang' },
          { shape: 'circle', color: '#0284C7', stroke: '#0369A1', name: 'Lingkaran' },
          { shape: 'flower', color: '#F97316', stroke: '#C2410C', name: 'Bunga' }
        ]
      }
    ];

    let currentLevelIdx = 0;
    let currentSlotIdx = 0;
    let rightPlaced = [null, null, null];
    let isTransitioning = false;

    const slotNames = ['ATAS', 'TENGAH', 'BAWAH'];

    function renderLevel() {
      const lvl = levels[currentLevelIdx];
      document.getElementById('levelBadge').textContent = `Level ${lvl.num} / 3`;
      document.getElementById('levelDesc').textContent = lvl.desc;

      // Render Sayap Kiri
      for (let i = 0; i < 3; i++) {
        const item = lvl.left[i];
        const g = document.getElementById(`leftSlot${i}`);
        g.innerHTML = `
          <circle cx="0" cy="0" r="38" fill="#FFFFFF" fill-opacity="0.85" stroke="#F43F5E" stroke-width="3"/>
          <g transform="translate(-28, -28)">
            ${renderShapeSvg(item.shape, item.color, item.stroke, 56)}
          </g>
          <circle cx="28" cy="-26" r="12" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/>
          <text x="28" y="-21" text-anchor="middle" fill="#BE123C" font-size="12" font-weight="bold">${i+1}</text>
        `;
      }

      // Render Sayap Kanan
      renderRightSlots();

      // Render Tombol Pilihan
      renderChoices();

      updateSlotInstruction();
    }

    function renderRightSlots() {
      for (let i = 0; i < 3; i++) {
        const g = document.getElementById(`rightSlot${i}`);
        const placed = rightPlaced[i];
        const isCurrent = (currentSlotIdx === i && !placed);

        if (placed) {
          g.innerHTML = `
            <g class="bounce-in">
              <circle cx="0" cy="0" r="38" fill="#FFFFFF" stroke="#10B981" stroke-width="3.5"/>
              <g transform="translate(-28, -28)">
                ${renderShapeSvg(placed.shape, placed.color, placed.stroke, 56)}
              </g>
              <circle cx="28" cy="-26" r="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
              <text x="28" y="-21" text-anchor="middle" fill="#047857" font-size="12" font-weight="bold">✓</text>
            </g>
          `;
        } else {
          g.innerHTML = `
            <circle cx="0" cy="0" r="38"
                    fill="${isCurrent ? '#FEF3C7' : '#FFFFFF'}"
                    fill-opacity="${isCurrent ? '0.9' : '0.6'}"
                    stroke="${isCurrent ? '#F59E0B' : '#94A3B8'}"
                    stroke-width="${isCurrent ? '4' : '3'}"
                    stroke-dasharray="${isCurrent ? '8,4' : '6,4'}"
                    class="${isCurrent ? 'pulse-target' : ''}"/>
            <text x="0" y="6" text-anchor="middle" fill="${isCurrent ? '#B45309' : '#94A3B8'}" font-size="18" font-weight="bold">
              ${isCurrent ? '?' : (i+1)}
            </text>
          `;
        }
      }
    }

    function renderChoices() {
      const container = document.getElementById('choicesContainer');
      container.innerHTML = '';
      const lvl = levels[currentLevelIdx];

      lvl.choices.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.id = `btnChoice${idx}`;
        btn.innerHTML = `
          ${renderShapeSvg(opt.shape, opt.color, opt.stroke, 46)}
          <span>${opt.name}</span>
        `;
        btn.addEventListener('click', () => onChoiceClicked(opt, btn));
        container.appendChild(btn);
      });
    }

    function updateSlotInstruction() {
      const el = document.getElementById('slotInstruction');
      if (currentSlotIdx < 3) {
        el.innerHTML = `👉 Pasang untuk bagian <b>${slotNames[currentSlotIdx]}</b> sayap kanan`;
      } else {
        el.innerHTML = `🎉 <b>Sempurna! Sayap kupu-kupu simetris!</b>`;
      }
    }

    function onChoiceClicked(option, btnElement) {
      if (isTransitioning || currentSlotIdx >= 3) return;
      initAudio();

      const lvl = levels[currentLevelIdx];
      const target = lvl.left[currentSlotIdx];

      // Periksa apakah jawaban BENAR
      let isCorrect = false;
      if (lvl.type === 'color') {
        isCorrect = (option.name === target.name);
      } else if (lvl.type === 'shape') {
        isCorrect = (option.shape === target.shape);
      } else {
        isCorrect = (option.shape === target.shape);
      }

      if (isCorrect) {
        // BENAR
        playCorrectSound();
        rightPlaced[currentSlotIdx] = option;
        renderRightSlots();
        currentSlotIdx++;
        updateSlotInstruction();

        // Cek jika 3 sayap sudah penuh
        if (currentSlotIdx === 3) {
          triggerLevelComplete();
        }
      } else {
        // SALAH (Goyang / shake animation & nada lembut)
        playWrongSound();
        btnElement.classList.remove('shake');
        void btnElement.offsetWidth; // trigger reflow
        btnElement.classList.add('shake');
        setTimeout(() => btnElement.classList.remove('shake'), 450);
      }
    }

    function triggerLevelComplete() {
      isTransitioning = true;
      playWingFlapSound();

      // Animasi kepak sayap
      const leftWing = document.getElementById('leftWingGroup');
      const rightWing = document.getElementById('rightWingGroup');

      leftWing.classList.add('flap-left');
      rightWing.classList.add('flap-right');

      setTimeout(() => {
        leftWing.classList.remove('flap-left');
        rightWing.classList.remove('flap-right');

        // Lanjut ke level berikutnya atau layar kemenangan
        if (currentLevelIdx < levels.length - 1) {
          currentLevelIdx++;
          currentSlotIdx = 0;
          rightPlaced = [null, null, null];
          isTransitioning = false;
          renderLevel();
        } else {
          // Kemenangan Akhir Level 3!
          playVictoryFanfare();
          document.getElementById('victoryModal').classList.add('active');
        }
      }, 1500);
    }

    // Tombol Main Lagi
    document.getElementById('btnPlayAgain').addEventListener('click', () => {
      document.getElementById('victoryModal').classList.remove('active');
      currentLevelIdx = 0;
      currentSlotIdx = 0;
      rightPlaced = [null, null, null];
      isTransitioning = false;
      renderLevel();
    });

    // Toggle Suara
    document.getElementById('btnSound').addEventListener('click', () => {
      isMuted = !isMuted;
      document.getElementById('btnSound').textContent = isMuted ? '🔇' : '🔊';
    });

    // Jalankan Game Pertama Kali
    renderLevel();
  </script>
</body>
</html>
